name: Daily fixtures

on:
  schedule:
    # 11:56 UTC = 6:56 AM CDT (Summer / Fall)
    # Change to "0 12 * * *" when Standard Time (CST) resumes in November
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - run: python fixtures.py
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
